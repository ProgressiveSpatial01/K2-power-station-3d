<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>K2 — 3D Excavation &amp; Clash POC</title>
    <style>
      html, body { margin: 0; height: 100%; background: #1a1a1a; }
      #app { position: relative; width: 100%; height: 100%; }
      #hud {
        position: absolute; top: 8px; left: 8px; z-index: 10;
        font: 12px/1.5 system-ui, sans-serif; color: #eee;
        background: rgba(0,0,0,0.55); padding: 8px 10px; border-radius: 6px;
        max-width: 340px;
      }
      #hud b { color: #ffb454; }
      #file-input { margin-top: 6px; display: block; }
    </style>
  </head>
  <body>
    <div id="app">
      <div id="hud">
        <div><b>K2 3D POC</b> — Phase A scaffold</div>
        <div id="status">Loading placeholder terrain…</div>
        <input id="file-input" type="file" accept=".ifc" />
      </div>
    </div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
