<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>K2 — 2D Site Map</title>
    <style>
      html, body { margin: 0; height: 100%; background: #1a1a1a; font: 13px/1.4 system-ui, sans-serif; }
      #layout { display: flex; height: 100%; }

      #sidebar {
        flex: 0 0 300px;
        width: 300px;
        background: #202225;
        color: #e6e6e6;
        display: flex;
        flex-direction: column;
        border-right: 1px solid #333;
        overflow: hidden;
      }
      #sidebar-header {
        padding: 12px 14px;
        border-bottom: 1px solid #333;
        display: flex;
        align-items: center;
        justify-content: space-between;
        flex-shrink: 0;
      }
      #sidebar-header h1 { font-size: 14px; margin: 0; color: #fff; }
      #view-toggle {
        font: 12px/1 system-ui, sans-serif; color: #fff; font-weight: 600;
        background: #2fa3ff; padding: 7px 12px; border-radius: 5px;
        text-decoration: none; white-space: nowrap;
      }
      #view-toggle:hover { background: #57b6ff; }

      #status-bar {
        padding: 8px 14px; font-size: 11px; color: #ffb454;
        border-bottom: 1px solid #333; flex-shrink: 0;
      }

      #sidebar-scroll { flex: 1; overflow-y: auto; }

      .panel-section { border-bottom: 1px solid #2c2e31; padding: 10px 14px 14px; }
      .panel-section h2 {
        font-size: 10px; text-transform: uppercase; letter-spacing: 0.06em;
        color: #8a8f98; margin: 0 0 8px;
      }
      .panel-section label.file-label { display: block; font-size: 11px; color: #aaa; margin-top: 8px; }
      .panel-section input[type="file"] { margin-top: 3px; display: block; font-size: 11px; width: 100%; color: #ccc; }
      .panel-section input[type="text"].subgroup-input {
        margin-top: 3px; display: block; font-size: 11px; width: 100%; box-sizing: border-box;
        background: #17181a; border: 1px solid #3a3d42; border-radius: 4px; color: #ddd; padding: 4px 6px;
      }
      .panel-section input[type="text"].subgroup-input::placeholder { color: #666; }

      #custodian-toggle {
        margin-top: 8px; width: 100%; font-size: 11px; padding: 6px 0;
        background: #1c1e21; border: 1px solid #3a3d42; border-radius: 4px; color: #ccc; cursor: pointer;
      }
      #custodian-toggle:hover { border-color: #57b6ff; color: #fff; }
      #custodian-toggle.unlocked { background: #1c3a2a; border-color: #2fbf6e; color: #7ee7ac; }

      .shared-files-empty { font-size: 11px; color: #666; font-style: italic; margin: 0; }
      .shared-file-row {
        display: flex; align-items: center; gap: 6px; padding: 4px 0; font-size: 11px; color: #ccc;
        border-bottom: 1px solid #26282b;
      }
      .shared-file-row .shared-file-name { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
      .shared-file-row .shared-file-meta { color: #777; font-size: 10px; flex-shrink: 0; }
      .shared-file-row .shared-file-delete {
        flex-shrink: 0; background: none; border: 1px solid #444; color: #aaa; border-radius: 4px;
        padding: 1px 6px; cursor: pointer; font-size: 11px;
      }
      .shared-file-row .shared-file-delete:hover { color: #fff; border-color: #d9534f; }

      .layer-group { margin-bottom: 2px; }
      .layer-group-header {
        display: flex; align-items: center; gap: 6px;
        padding: 5px 2px; cursor: pointer; border-radius: 4px; user-select: none;
      }
      .layer-group-header:hover { background: #2a2d31; }
      .layer-group-header .caret { width: 10px; font-size: 10px; color: #8a8f98; flex-shrink: 0; }
      .layer-group-header .layer-group-title {
        font-weight: 600; font-size: 12px; color: #ddd;
        white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0;
      }
      .layer-group-body { margin-left: 16px; }
      .layer-group-empty { margin-left: 16px; font-size: 11px; color: #666; font-style: italic; padding: 2px 0 6px; }

      .layer-row {
        display: flex; align-items: center; gap: 6px;
        padding: 3px 2px; font-size: 12px; color: #cfd2d6; cursor: pointer;
        min-width: 0;
      }
      .layer-row:hover { color: #fff; }
      .layer-row input[type="checkbox"], .layer-row input[type="radio"] { flex-shrink: 0; }
      .layer-row .swatch {
        width: 10px; height: 10px; border-radius: 2px; flex-shrink: 0; border: 1px solid rgba(255,255,255,0.3);
      }
      .layer-row .layer-row-label {
        white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0;
      }
      .layer-group-header, .layer-row { min-width: 0; }

      /* Rename (✎) / delete (🗑) affordances (2026-08-31) — low-key
         until you actually reach for them: a faint always-visible hint,
         full strength on hovering the row/group, and a highlight on
         hovering the button itself. Delete only appears where a caller
         actually wired an onDelete — see layer-tree.js. */
      .layer-icon-btn {
        flex-shrink: 0; margin-left: auto; background: none; border: none; cursor: pointer;
        font-size: 11px; line-height: 1; padding: 2px 3px; border-radius: 3px;
        color: #8a8f98; opacity: 0.35;
      }
      .layer-row:hover .layer-icon-btn, .layer-group-header:hover .layer-icon-btn { opacity: 1; }
      .layer-icon-btn:hover { background: #3a3d42; color: #fff; }

      .layer-rename-input {
        flex: 1; min-width: 0; font: inherit; color: inherit;
        background: #111; border: 1px solid #2fa3ff; border-radius: 3px; padding: 1px 4px;
      }

      /* Map area: map on top, (optional) section-profile pane tiled
         across the bottom, full width. Was side-by-side (map | profile)
         originally — flipped 2026-08-27 per Cameron, who confirmed he
         actually meant "tiles the screen" as a horizontal split (map on
         top, profile pane along the bottom), not the side-by-side guess
         this started with — see the README correction. */
      #map-area { flex: 1; display: flex; flex-direction: column; min-height: 0; }
      /* Mapbox owns #map's DOM internally (it warns if given non-empty
         children) — the toolbar/measure-result overlays live in this
         wrapper instead, positioned absolutely over the map canvas. */
      #map-wrapper { flex: 1; position: relative; min-height: 0; }
      #map { position: absolute; inset: 0; }

      #profile-pane {
        flex: 0 0 50%; /* half the page by default, per Cameron */
        display: none;
        flex-direction: column;
        background: #17181a;
        color: #e6e6e6;
        border-top: 1px solid #333;
        min-height: 0;
      }
      #profile-pane.active { display: flex; }
      /* "Expand" (per Cameron: "just need to be able to expand it") grows
         the pane to most of the screen, for a closer look at the chart —
         toggled by #profile-expand, see wireMapToolbar(). */
      #profile-pane.expanded { flex-basis: 85%; }
      #profile-header {
        display: flex; align-items: center; justify-content: space-between;
        gap: 8px; padding: 10px 14px; border-bottom: 1px solid #2c2e31; flex-shrink: 0;
      }
      #profile-header h2 { font-size: 12px; margin: 0; color: #ddd; text-transform: uppercase; letter-spacing: 0.06em; }
      #profile-header-buttons { display: flex; gap: 6px; margin-left: auto; }
      #profile-expand, #profile-close {
        background: none; border: 1px solid #444; color: #aaa; border-radius: 4px;
        padding: 3px 8px; cursor: pointer; font-size: 12px;
      }
      #profile-expand:hover, #profile-close:hover { color: #fff; border-color: #666; }
      #profile-body { flex: 1; padding: 14px; overflow-y: auto; min-height: 0; }
      #profile-summary { font-size: 11px; color: #8a8f98; margin-bottom: 10px; }
      .profile-empty { color: #888; font-size: 12px; }

      /* Floating vertical map toolbar, left edge of the map (à la Civillo) */
      #map-toolbar {
        position: absolute; top: 14px; left: 14px; z-index: 5;
        display: flex; flex-direction: column; gap: 6px;
        background: rgba(23,24,26,0.9); border: 1px solid #333; border-radius: 6px;
        padding: 6px;
      }
      #map-toolbar button {
        display: block; width: 84px; text-align: left;
        background: none; border: none; color: #ccc; font-size: 12px;
        padding: 6px 8px; border-radius: 4px; cursor: pointer;
      }
      #map-toolbar button:hover { background: #2a2d31; color: #fff; }
      #map-toolbar button.active { background: #2fa3ff; color: #fff; }
      #map-toolbar hr { border: none; border-top: 1px solid #333; margin: 2px 4px; }

      #measure-result {
        position: absolute; top: 14px; left: 112px; z-index: 5;
        background: rgba(23,24,26,0.9); border: 1px solid #333; border-radius: 6px;
        padding: 8px 12px; font-size: 12px; color: #ffb454; display: none;
      }
      #measure-result.active { display: block; }
    </style>
  </head>
  <body>
    <div id="layout">
      <aside id="sidebar">
        <div id="sidebar-header">
          <h1>K2 Site Map</h1>
          <a id="view-toggle" href="/3d.html">3D View →</a>
        </div>
        <div id="status-bar">Loading map…</div>
        <div id="sidebar-scroll">
          <section class="panel-section">
            <h2>Shared Data</h2>
            <div id="shared-files-list">
              <p class="shared-files-empty">Nothing shared yet.</p>
            </div>
            <button id="custodian-toggle" type="button">🔒 Unlock custodian mode</button>
          </section>
          <section id="add-data-section" class="panel-section" style="display: none;">
            <h2>Add Data</h2>
            <label class="file-label" for="design-input">Design (.ifc / .12da / .12daz)</label>
            <input id="design-input" type="file" accept=".ifc,.12da,.12daz" />
            <input
              id="design-subgroup"
              type="text"
              class="subgroup-input"
              placeholder="Subgroup (optional, e.g. &quot;Structural&quot;)"
              title="Applies to the next Design file you choose above — IFC designs and surfaces (design linework groups itself by its own 12d model paths already)."
            />
            <label class="file-label" for="services-input">12d services (.12da / .12daz)</label>
            <input id="services-input" type="file" accept=".12da,.12daz" />
          </section>
          <section class="panel-section">
            <h2>Layers</h2>
            <div id="layer-tree"></div>
          </section>
        </div>
      </aside>
      <div id="map-area">
        <div id="map-wrapper">
          <div id="map"></div>
          <div id="map-toolbar">
            <button id="tool-distance" title="Measure distance">📏 Distance</button>
            <button id="tool-area" title="Measure area">▱ Area</button>
            <hr />
            <button id="tool-section" title="Cut a section/profile">⛰ Section</button>
            <hr />
            <button id="tool-clear" title="Clear the current measurement/section">✕ Clear</button>
          </div>
          <div id="measure-result"></div>
        </div>
        <div id="profile-pane">
          <div id="profile-header">
            <h2>Section Profile</h2>
            <div id="profile-header-buttons">
              <button id="profile-expand" title="Expand to most of the screen">⤢ Expand</button>
              <button id="profile-close">✕ Close</button>
            </div>
          </div>
          <div id="profile-body">
            <div id="profile-summary"></div>
            <div id="profile-chart"></div>
          </div>
        </div>
      </div>
    </div>
    <!-- Offscreen container for the headless @thatopen/components engine
         used to read real IFC footprint geometry (not rendered visibly
         here — see main-2d.js's IFC footprint code). -->
    <div id="ifc-offscreen" style="position: absolute; left: -9999px; top: 0; width: 1px; height: 1px; overflow: hidden;"></div>
    <script type="module" src="/src/main-2d.js"></script>
  </body>
</html>
