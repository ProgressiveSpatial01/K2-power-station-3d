<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>K2 — 2D Site Map</title>
    <style>
      html, body { margin: 0; height: 100%; background: #1a1a1a; font: 13px/1.4 system-ui, sans-serif; }
      #layout { display: flex; height: 100%; }

      #sidebar {
        flex: 0 0 300px;
        width: 300px;
        background: #202225;
        color: #e6e6e6;
        display: flex;
        flex-direction: column;
        border-right: 1px solid #333;
        overflow: hidden;
      }
      #sidebar-header {
        padding: 12px 14px;
        border-bottom: 1px solid #333;
        display: flex;
        align-items: center;
        justify-content: space-between;
        flex-shrink: 0;
      }
      #sidebar-header h1 { font-size: 14px; margin: 0; color: #fff; }
      #view-toggle {
        font: 12px/1 system-ui, sans-serif; color: #fff; font-weight: 600;
        background: #2fa3ff; padding: 7px 12px; border-radius: 5px;
        text-decoration: none; white-space: nowrap;
      }
      #view-toggle:hover { background: #57b6ff; }

      #status-bar {
        padding: 8px 14px; font-size: 11px; color: #ffb454;
        border-bottom: 1px solid #333; flex-shrink: 0;
      }

      #sidebar-scroll { flex: 1; overflow-y: auto; }

      .panel-section { border-bottom: 1px solid #2c2e31; padding: 10px 14px 14px; }
      .panel-section h2 {
        font-size: 10px; text-transform: uppercase; letter-spacing: 0.06em;
        color: #8a8f98; margin: 0 0 8px;
      }
      .panel-section label.file-label { display: block; font-size: 11px; color: #aaa; margin-top: 8px; }
      .panel-section input[type="file"] { margin-top: 3px; display: block; font-size: 11px; width: 100%; color: #ccc; }

      .layer-group { margin-bottom: 2px; }
      .layer-group-header {
        display: flex; align-items: center; gap: 6px;
        padding: 5px 2px; cursor: pointer; border-radius: 4px; user-select: none;
      }
      .layer-group-header:hover { background: #2a2d31; }
      .layer-group-header .caret { width: 10px; font-size: 10px; color: #8a8f98; }
      .layer-group-header .layer-group-title { font-weight: 600; font-size: 12px; color: #ddd; }
      .layer-group-body { margin-left: 16px; }
      .layer-group-empty { margin-left: 16px; font-size: 11px; color: #666; font-style: italic; padding: 2px 0 6px; }

      .layer-row {
        display: flex; align-items: center; gap: 6px;
        padding: 3px 2px; font-size: 12px; color: #cfd2d6; cursor: pointer;
      }
      .layer-row:hover { color: #fff; }
      .layer-row input[type="checkbox"], .layer-row input[type="radio"] { flex-shrink: 0; }
      .layer-row .swatch {
        width: 10px; height: 10px; border-radius: 2px; flex-shrink: 0; border: 1px solid rgba(255,255,255,0.3);
      }

      /* Map area: map + (optional) section-profile pane side by side */
      #map-area { flex: 1; display: flex; min-width: 0; }
      /* Mapbox owns #map's DOM internally (it warns if given non-empty
         children) — the toolbar/measure-result overlays live in this
         wrapper instead, positioned absolutely over the map canvas. */
      #map-wrapper { flex: 1; position: relative; min-width: 0; }
      #map { position: absolute; inset: 0; }

      #profile-pane {
        flex: 0 0 420px;
        display: none;
        flex-direction: column;
        background: #17181a;
        color: #e6e6e6;
        border-left: 1px solid #333;
      }
      #profile-pane.active { display: flex; }
      #profile-header {
        display: flex; align-items: center; justify-content: space-between;
        padding: 10px 14px; border-bottom: 1px solid #2c2e31; flex-shrink: 0;
      }
      #profile-header h2 { font-size: 12px; margin: 0; color: #ddd; text-transform: uppercase; letter-spacing: 0.06em; }
      #profile-close {
        background: none; border: 1px solid #444; color: #aaa; border-radius: 4px;
        padding: 3px 8px; cursor: pointer; font-size: 12px;
      }
      #profile-close:hover { color: #fff; border-color: #666; }
      #profile-body { flex: 1; padding: 14px; overflow-y: auto; }
      #profile-summary { font-size: 11px; color: #8a8f98; margin-bottom: 10px; }
      .profile-empty { color: #888; font-size: 12px; }

      /* Floating vertical map toolbar, left edge of the map (à la Civillo) */
      #map-toolbar {
        position: absolute; top: 14px; left: 14px; z-index: 5;
        display: flex; flex-direction: column; gap: 6px;
        background: rgba(23,24,26,0.9); border: 1px solid #333; border-radius: 6px;
        padding: 6px;
      }
      #map-toolbar button {
        display: block; width: 84px; text-align: left;
        background: none; border: none; color: #ccc; font-size: 12px;
        padding: 6px 8px; border-radius: 4px; cursor: pointer;
      }
      #map-toolbar button:hover { background: #2a2d31; color: #fff; }
      #map-toolbar button.active { background: #2fa3ff; color: #fff; }
      #map-toolbar hr { border: none; border-top: 1px solid #333; margin: 2px 4px; }

      #measure-result {
        position: absolute; top: 14px; left: 112px; z-index: 5;
        background: rgba(23,24,26,0.9); border: 1px solid #333; border-radius: 6px;
        padding: 8px 12px; font-size: 12px; color: #ffb454; display: none;
      }
      #measure-result.active { display: block; }
    </style>
  </head>
  <body>
    <div id="layout">
      <aside id="sidebar">
        <div id="sidebar-header">
          <h1>K2 Site Map</h1>
          <a id="view-toggle" href="/3d.html">3D View →</a>
        </div>
        <div id="status-bar">Loading map…</div>
        <div id="sidebar-scroll">
          <section class="panel-section">
            <h2>Add Data</h2>
            <label class="file-label" for="ifc-input">IFC design (.ifc)</label>
            <input id="ifc-input" type="file" accept=".ifc" />
            <label class="file-label" for="services-input">12d services (.12da / .12daz)</label>
            <input id="services-input" type="file" accept=".12da,.12daz" />
          </section>
          <section class="panel-section">
            <h2>Layers</h2>
            <div id="layer-tree"></div>
          </section>
        </div>
      </aside>
      <div id="map-area">
        <div id="map-wrapper">
          <div id="map"></div>
          <div id="map-toolbar">
            <button id="tool-distance" title="Measure distance">📏 Distance</button>
            <button id="tool-area" title="Measure area">▱ Area</button>
            <hr />
            <button id="tool-section" title="Cut a section/profile">⛰ Section</button>
            <hr />
            <button id="tool-clear" title="Clear the current measurement/section">✕ Clear</button>
          </div>
          <div id="measure-result"></div>
        </div>
        <div id="profile-pane">
          <div id="profile-header">
            <h2>Section Profile</h2>
            <button id="profile-close">✕ Close</button>
          </div>
          <div id="profile-body">
            <div id="profile-summary"></div>
            <div id="profile-chart"></div>
          </div>
        </div>
      </div>
    </div>
    <!-- Offscreen container for the headless @thatopen/components engine
         used to read real IFC footprint geometry (not rendered visibly
         here — see main-2d.js's IFC footprint code). -->
    <div id="ifc-offscreen" style="position: absolute; left: -9999px; top: 0; width: 1px; height: 1px; overflow: hidden;"></div>
    <script type="module" src="/src/main-2d.js"></script>
  </body>
</html>
