<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>K2 — 3D Excavation &amp; Clash POC</title>
    <style>
      html, body { margin: 0; height: 100%; background: #1a1a1a; }
      #app { position: relative; width: 100%; height: 100%; }
      #hud {
        position: absolute; top: 8px; left: 8px; z-index: 20;
        font: 12px/1.5 system-ui, sans-serif; color: #eee;
        background: rgba(23,24,26,0.92); border: 1px solid #333; padding: 10px 12px; border-radius: 8px;
        max-width: 340px; max-height: calc(100vh - 24px); overflow-y: auto;
      }
      #hud b { color: #ffb454; }
      #hud label { display: block; margin-top: 8px; font-size: 11px; color: #bbb; }
      #hud input[type="file"] { margin-top: 2px; display: block; font-size: 11px; width: 100%; color: #ccc; }
      .hud-title-row { display: flex; align-items: center; justify-content: space-between; gap: 8px; }

      /* Collapsible panel on mobile (2026-09-16, per Cameron: "just need
         to be able to collapse it as well, takes up a whole phone
         screen") — same off-canvas convention as index.html's sidebar
         (#sidebar-toggle/#sidebar-close/#sidebar-backdrop): desktop is
         untouched (#hud stays permanently visible, as before); below
         768px it starts CLOSED so the 3D view gets the full screen, and
         opens via a floating hamburger, dismissed by its own ✕, the
         backdrop, or the hamburger again. */
      #hud-toggle {
        display: none; /* shown only under the mobile media query below */
        position: fixed; top: 12px; left: 12px; z-index: 30;
        width: 40px; height: 40px; border-radius: 8px;
        background: rgba(23,24,26,0.92); border: 1px solid #333; color: #fff;
        font-size: 18px; align-items: center; justify-content: center; cursor: pointer;
      }
      #hud-backdrop {
        display: none;
        position: fixed; inset: 0; background: rgba(0,0,0,0.45); z-index: 19;
      }
      #hud-close { display: none; } /* only relevant once the panel can open at all */

      @media (max-width: 768px) {
        #hud-toggle { display: flex; }
        /* Hamburger hides once the panel's open — the header ✕ takes
           over, rather than two overlapping controls in the same corner. */
        #app.hud-open #hud-toggle { display: none; }

        #hud { display: none; }
        #app.hud-open #hud { display: block; }
        #app.hud-open #hud-backdrop { display: block; }

        #hud-close {
          display: inline-flex; align-items: center; justify-content: center;
          background: none; border: none; color: #ccc; font-size: 16px;
          cursor: pointer; padding: 4px 8px;
        }
        #hud-close:hover { color: #fff; }
      }
      #view-toggle {
        position: absolute; top: 8px; right: 8px; z-index: 10;
        font: 13px/1 system-ui, sans-serif; color: #fff;
        background: #2fa3ff; padding: 10px 16px; border-radius: 6px;
        text-decoration: none; font-weight: 600;
      }
      #view-toggle:hover { background: #57b6ff; }

      /* Shared Data / custodian mode — same visual language and class
         names as index.html's sidebar (2026-09-10), so renderSharedFilesList()
         and friends work identically in both pages without a rewrite. */
      .hud-section { border-top: 1px solid #2c2e31; margin-top: 10px; padding-top: 10px; }
      .hud-section:first-child { border-top: none; margin-top: 0; padding-top: 0; }
      .hud-section h2 {
        font-size: 10px; text-transform: uppercase; letter-spacing: 0.06em;
        color: #8a8f98; margin: 0 0 6px;
      }
      #custodian-toggle {
        margin-top: 8px; width: 100%; font-size: 11px; padding: 6px 0;
        background: #1c1e21; border: 1px solid #3a3d42; border-radius: 4px; color: #ccc; cursor: pointer;
      }
      #custodian-toggle:hover { border-color: #57b6ff; color: #fff; }
      #custodian-toggle.unlocked { background: #1c3a2a; border-color: #2fbf6e; color: #7ee7ac; }

      .shared-files-empty { font-size: 11px; color: #666; font-style: italic; margin: 0; }
      .shared-file-row {
        display: flex; align-items: center; gap: 6px; padding: 4px 0; font-size: 11px; color: #ccc;
        border-bottom: 1px solid #26282b;
      }
      .shared-file-row .shared-file-name { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
      .shared-file-row .shared-file-meta { color: #777; font-size: 10px; flex-shrink: 0; }
      .shared-file-row .shared-file-delete {
        flex-shrink: 0; background: none; border: 1px solid #444; color: #aaa; border-radius: 4px;
        padding: 1px 6px; cursor: pointer; font-size: 11px;
      }
      .shared-file-row .shared-file-delete:hover { color: #fff; border-color: #d9534f; }

      /* Layers panel (2026-09-10, upgraded to the full nested/grouped
         tree 2026-09-15 per Cameron: "any chance we can get the same
         layering and side bar on the 3d viewer?") — identical class
         names and rules to index.html's sidebar layer tree, so
         layer-tree.js's DOM (built by createLayerGroup()) renders the
         same way in both pages without a second implementation. */
      .layer-group { margin-bottom: 2px; }
      .layer-group-header {
        display: flex; align-items: center; gap: 6px;
        padding: 5px 2px; cursor: pointer; border-radius: 4px; user-select: none;
      }
      .layer-group-header:hover { background: #2a2d31; }
      .layer-group-header .caret { width: 10px; font-size: 10px; color: #8a8f98; flex-shrink: 0; }
      .layer-group-header .layer-group-title {
        font-weight: 600; font-size: 12px; color: #ddd;
        white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0;
      }
      .layer-group-body { margin-left: 16px; }
      .layer-group-empty { margin-left: 16px; font-size: 11px; color: #666; font-style: italic; padding: 2px 0 6px; }

      .layer-row {
        display: flex; align-items: center; gap: 6px;
        padding: 3px 2px; font-size: 12px; color: #cfd2d6; cursor: pointer;
        min-width: 0;
      }
      .layer-row:hover { color: #fff; }
      .layer-row input[type="checkbox"], .layer-row input[type="radio"] { flex-shrink: 0; }
      .layer-row .swatch {
        width: 10px; height: 10px; border-radius: 2px; flex-shrink: 0; border: 1px solid rgba(255,255,255,0.3);
      }
      .layer-row .layer-row-label {
        white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0;
      }
      .layer-group-header, .layer-row { min-width: 0; }

      /* Rename (✎) affordance only here — delete isn't wired for 3D
         layers (see main.js createModelGroupedLayerController()/
         addFlatLayerRow(): no onDelete passed, so layer-tree.js simply
         doesn't render a delete button; nothing to disable). A faint
         always-visible hint, full strength on hovering the row/group. */
      .layer-icon-btn {
        flex-shrink: 0; margin-left: auto; background: none; border: none; cursor: pointer;
        font-size: 11px; line-height: 1; padding: 2px 3px; border-radius: 3px;
        color: #8a8f98; opacity: 0.35;
      }
      .layer-row:hover .layer-icon-btn, .layer-group-header:hover .layer-icon-btn { opacity: 1; }
      .layer-icon-btn:hover { background: #3a3d42; color: #fff; }

      .layer-rename-input {
        flex: 1; min-width: 0; font: inherit; color: inherit;
        background: #111; border: 1px solid #2fa3ff; border-radius: 3px; padding: 1px 4px;
      }
    </style>
  </head>
  <body>
    <div id="app">
      <a id="view-toggle" href="/index.html">← 2D Map</a>
      <button id="hud-toggle" type="button" aria-label="Open panel">☰</button>
      <div id="hud-backdrop"></div>
      <div id="hud">
        <div class="hud-title-row">
          <b>K2 3D</b>
          <button id="hud-close" type="button" aria-label="Close panel">✕</button>
        </div>
        <div id="status">Loading terrain…</div>

        <div class="hud-section">
          <h2>Shared Data</h2>
          <div id="shared-files-list">
            <p class="shared-files-empty">Nothing shared yet.</p>
          </div>
          <button id="custodian-toggle" type="button">🔒 Unlock custodian mode</button>
        </div>

        <div id="add-data-section" class="hud-section" style="display: none;">
          <h2>Add Data</h2>
          <label for="design-input">Design (.ifc / .12da / .12daz)</label>
          <input id="design-input" type="file" accept=".ifc,.12da,.12daz" />
          <label for="services-input">12d services (.12da / .12daz)</label>
          <input id="services-input" type="file" accept=".12da,.12daz" />
        </div>

        <div class="hud-section">
          <h2>Layers</h2>
          <div id="layer-tree"></div>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
